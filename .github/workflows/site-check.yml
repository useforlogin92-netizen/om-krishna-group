name: Website checks

on:
  push:
    branches:
      - main
      - feature/website-v2
  pull_request:
    branches:
      - main
      - feature/website-v2

permissions:
  contents: read

jobs:
  static-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static smoke tests
        run: npm test
